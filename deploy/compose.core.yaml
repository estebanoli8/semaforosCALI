# Candidato de integración, todavía NO instalador del portal completo.
# SC_DATABASE_URL corresponde exclusivamente a la base nueva semaforos_core.
services:
  database:
    image: postgres:16
    environment:
      POSTGRES_DB: semaforos_core
      POSTGRES_USER: semaforos_core
      POSTGRES_PASSWORD: ${SC_DATABASE_PASSWORD:?Configurar contraseña privada}
    volumes:
      - core_database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U semaforos_core -d semaforos_core"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped
  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.core
    command: [python, -m, semaforos, migrate]
    environment:
      SC_DATABASE_URL: ${SC_DATABASE_URL:?Configurar URL de base exclusiva}
    depends_on:
      database:
        condition: service_healthy
    restart: 'no'
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.core
    environment:
      SC_DATABASE_URL: ${SC_DATABASE_URL:?Configurar URL de base exclusiva}
      SC_API_TOKEN: ${SC_API_TOKEN:?Configurar token privado de 32 caracteres o más}
    volumes:
      - core_data:/data
    expose: ["8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped
  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.core
    command: [python, -m, semaforos, worker]
    environment:
      SC_DATABASE_URL: ${SC_DATABASE_URL:?Configurar URL de base exclusiva}
      OLLAMA_URL: ${OLLAMA_URL:?Configurar dirección interna autorizada de Ollama}
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    volumes:
      - core_data:/data
      - core_models:/models
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 3g
    cpus: 2
    restart: unless-stopped
volumes:
  core_database:
  core_data:
  core_models:
