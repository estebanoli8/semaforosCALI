name: Pruebas
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Comparador
        run: python -m unittest discover -s tests -v
      - name: Prototipo audiovisual
        run: python -m unittest discover -s prototype/v0_3 -p 'test_*.py' -v
      - name: Carga continua y recuperación
        run: python -m unittest discover -s prototype/v0_4 -p 'test_*.py' -v
